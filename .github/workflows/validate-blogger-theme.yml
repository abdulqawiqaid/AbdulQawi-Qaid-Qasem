name: Validate Blogger theme archive

on:
  pull_request:
    branches: [main]
    paths:
      - "sites/abdulqawiqaid.org/blogger-theme/**"
      - ".github/workflows/validate-blogger-theme.yml"
  push:
    branches: [feature/blogger-site-integration]
    paths:
      - "sites/abdulqawiqaid.org/blogger-theme/**"
      - ".github/workflows/validate-blogger-theme.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-original-archive:
    name: Validate original Blogger XML and checksum
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate XML and immutable source checksum
        shell: bash
        run: |
          set -euo pipefail
          file="sites/abdulqawiqaid.org/blogger-theme/original/blogger-theme-original.xml"
          test -f "$file"
          python - "$file" <<'PY'
          import hashlib
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          path = pathlib.Path(sys.argv[1])
          raw = path.read_bytes()
          expected = "e7d8034ad7af3bbdfced737ba75b3bd3ad2efa5f457326fa05d9e861455b4da4"
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f"SHA-256 mismatch: expected {expected}, got {actual}")
          ET.parse(path)
          print(f"XML parse: PASS")
          print(f"SHA-256: {actual}")
          print(f"Bytes: {len(raw)}")
          PY
